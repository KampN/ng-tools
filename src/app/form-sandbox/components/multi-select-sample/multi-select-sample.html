<mat-toolbar>
	Multi-select
</mat-toolbar>
<div>
	<form [formGroup]="form">
		<div formControlName="states" libFormSelectGroup>
			<div>
				<mat-checkbox libFormSelectControl="A">A</mat-checkbox>
			</div>
			<div>
				<mat-checkbox libFormSelectControl="B">B</mat-checkbox>
			</div>
			<div>
				<mat-slide-toggle libFormSelectControl="B">B</mat-slide-toggle>
			</div>
		</div>

		<div>
			<div>valid : {{form.valid}}</div>
			<pre>{{form.value|json}}</pre>
		</div>

	</form>
</div>
