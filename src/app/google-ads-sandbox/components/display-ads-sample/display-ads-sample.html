<mat-toolbar>
  Display Ad
</mat-toolbar>

<div class="sample-title">
  Image Ad - Landscape display
</div>
<div class="sample-block">
  @for (model of imageAdModels; track model) {
    <lib-display-image-ad class="sample-item" [data]="model"></lib-display-image-ad>
  }
</div>

<mat-divider></mat-divider>

<div class="sample-title">
  Image Ad - Tower display
</div>
<div class="sample-block">
  @for (model of imageAdModels; track model) {
    <lib-display-image-ad-tower class="sample-item" [data]="model"></lib-display-image-ad-tower>
  }
</div>

<mat-divider></mat-divider>

<div class="sample-title">
  Text Ad
</div>
<div class="sample-block">
  @for (model of textAdModels; track model) {
    <lib-display-text-ad class="sample-item" [data]="model"></lib-display-text-ad>
  }
</div>

<mat-divider></mat-divider>

<div class="sample-title">
  Native Ad
</div>
<div class="sample-block">

  <lib-display-native-ad class="sample-item" [data]="nativeAdModels.large"></lib-display-native-ad>
  <lib-display-native-ad-collapsed class="sample-item" [data]="nativeAdModels.collapsed"></lib-display-native-ad-collapsed>

</div>

<mat-divider></mat-divider>
